<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平特一肖 - MCSX3V9</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .num-ball { display:inline-block; width:28px; height:28px; line-height:28px; text-align:center; border-radius:50%; font-weight:bold; font-size:14px; color:white; margin-right:2px;}
        .bg-r1 { background-color: #dc2626; } /* 红 */
        .bg-r2 { background-color: #f59e0b; } /* 橙 */
        .bg-r3 { background-color: #8b5cf6; } /* 紫 */
        .bg-r4 { background-color: #3b82f6; } /* 蓝 */
        .bg-r5 { background-color: #6b7280; } /* 灰 */
        
        /* 自定义导航高亮样式 */
        .navbar-nav .nav-link {
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.7) !important;
        }
        .navbar-nav .nav-link:hover {
            color: #fff !important;
        }
        .navbar-nav .nav-link.active-custom {
            color: #5ac8fa !important; /* 亮天蓝色，可自定义 */
            font-weight: 700 !important;
            text-shadow: 0 0 8px rgba(90, 200, 250, 0.4);
        }
    </style>
</head>
<body>
    {% set current_path = request.path %}
    <!-- 统一导航 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">MCSX3V9 特码</a>
            <!-- 手机端汉堡包按钮 -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#pingteNav" aria-controls="pingteNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- 折叠菜单内容 -->
            <div class="collapse navbar-collapse" id="pingteNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if current_path == '/pingte/' or current_path == '/pingte' %}active-custom{% endif %}" 
                           href="/pingte/">开奖数据</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if current_path == '/pingte/rank' %}active-custom{% endif %}" 
                           href="/pingte/rank">排行榜</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if current_path == '/pingte/betting' %}active-custom{% endif %}" 
                           href="/pingte/betting">下注台</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
